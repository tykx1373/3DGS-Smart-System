name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# 同一分支连续 push 时取消上一次还在跑的 CI，省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Windows-only project: the prebuilt .pyd files are win_amd64 and the
    # installers are .bat/.ps1. GUI tests run Qt with the offscreen platform.
    # cp310 / cp311 are the two ABIs covered by the prebuilt vksplat .pyd
    # (see environment.yaml and syscheck.check_python).
    name: checks (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      # Node 20 was removed from the runners on 2026-09-23, so node20 actions are
      # now force-run on Node 24 with a deprecation warning. Minimal node24 majors:
      # checkout v5 (not v6/v7, which change credential and fork-PR behaviour).
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install --upgrade pip "PySide6>=6.8,<6.9" pillow opencv-python-headless

      - name: Byte-compile Python sources
        # tools/vksplat/vksplat is not imported by the unit tests (torch/vksplat
        # are absent in CI), so compileall is the only syntax net for it.
        run: python -m compileall -q gui tests doctor.py tools/vksplat/vksplat

      # PowerShell 5.1 on a user's machine reads a BOM-less .ps1 as ANSI, which
      # has already broken download_tools.ps1 twice. tests/test_repo_rules.py
      # guards the encoding; this guards actual syntax.
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem -Recurse -Filter *.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $f.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) {
              Write-Host "::error file=$($f.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              $bad++
            }
          }
          if ($bad -gt 0) { throw "$bad PowerShell parse error(s)" }
          Write-Host "PowerShell syntax OK"

      - name: Doctor smoke test
        shell: pwsh
        run: |
          # A CI runner has no GPU / COLMAP, so a non-zero exit is expected here:
          # only the JSON shape matters. Write outside the repo so the repo-rule
          # tests do not pick the file up.
          $out = Join-Path $env:RUNNER_TEMP doctor.json
          python doctor.py --json > $out
          if ($LASTEXITCODE -ne 0) { Write-Host "doctor exited $LASTEXITCODE (expected on CI)" }
          # len(c) >= 9 must stay in sync with syscheck.run_all; lowering it
          # silently would let a deleted check go green.
          python -c "import json,sys; d=json.load(open(sys.argv[1],encoding='utf-8')); c=d['checks']; ok=(len(c)>=9 and all({'name','status','detail','hint'}<=set(x) and x['status'] in ('ok','warn','fail') for x in c) and isinstance(d['can_run'],bool)); print('doctor json:', len(c), 'checks, ok =', ok); sys.exit(0 if ok else 1)" $out

      - name: Unit tests
        run: python -m unittest discover -s tests -v
