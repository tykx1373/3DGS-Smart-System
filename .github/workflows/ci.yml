name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    # Windows-only project: the prebuilt .pyd files are win_amd64 and the
    # installers are .bat/.ps1. The Windows runner also ships tkinter with the
    # official Python build, so the GUI tests can actually run.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"        # keep in sync with environment.yaml

      - name: Install test dependencies
        run: python -m pip install --upgrade pip customtkinter

      - name: Byte-compile Python sources
        run: python -m compileall -q gui doctor.py tests

      # PowerShell 5.1 on a user's machine reads a BOM-less .ps1 as ANSI, which
      # has already broken download_tools.ps1 twice. tests/test_repo_rules.py
      # guards the encoding; this guards actual syntax.
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem -Recurse -Filter *.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $f.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) {
              Write-Host "::error file=$($f.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              $bad++
            }
          }
          if ($bad -gt 0) { throw "$bad PowerShell parse error(s)" }
          Write-Host "PowerShell syntax OK"

      - name: Doctor smoke test
        shell: pwsh
        run: |
          # A CI runner has no GPU / COLMAP, so a non-zero exit is expected here:
          # only the JSON shape matters. Write outside the repo so the repo-rule
          # tests do not pick the file up.
          $out = Join-Path $env:RUNNER_TEMP doctor.json
          python doctor.py --json > $out
          if ($LASTEXITCODE -ne 0) { Write-Host "doctor exited $LASTEXITCODE (expected on CI)" }
          python -c "import json,sys; d=json.load(open(sys.argv[1],encoding='utf-8')); c=d['checks']; ok=(len(c)>=6 and all({'name','status','detail','hint'}<=set(x) and x['status'] in ('ok','warn','fail') for x in c) and isinstance(d['can_run'],bool)); print('doctor json:', len(c), 'checks, ok =', ok); sys.exit(0 if ok else 1)" $out

      - name: Unit tests
        run: python -m unittest discover -s tests -v